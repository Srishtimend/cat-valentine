<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Pawsome Surprise! 🐾</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #f0f4ff 0%, #d7e3fc 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .paw-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(173, 193, 255, 0.3);
            max-width: 450px;
            width: 85%;
            position: relative;
            z-index: 10;
            border: 3px solid #abc4ff;
        }

        h1 { color: #3d5a80; font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #2b2d42; font-size: 1.1rem; }

        .btn {
            background: linear-gradient(45deg, #72efdd, #48cae4);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(72, 202, 228, 0.4);
            transition: transform 0.2s;
        }

        .btn:hover { transform: scale(1.05); }

        #photo-page { display: none; }

        .cat-photo {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 20px;
            margin: 20px 0;
            border: 6px solid #edf2fb;
        }

        .falling-paw {
            position: absolute;
            font-size: 24px;
            opacity: 0.6;
            animation: fall linear forwards;
            color: #abc4ff;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .cat-emoji {
            font-size: 60px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="paw-container" id="paw-container"></div>

    <div id="welcome-page" class="card">
        <span class="cat-emoji">🐱</span>
        <h1>To My Purrfect Friend!</h1>
        <p>I have a pawsome surprise for you. Prepare for maximum cuteness overload!</p>
        <button class="btn" onclick="showPhoto()">Click For Cuteness! ✨</button>
    </div>

    <div id="photo-page" class="card">
        <h1>Happy Valentine's Day!</h1>
        <img src="sahya.JPG" alt="You and your cat" class="cat-photo">
        <p>From me & my purrfect pal. ^..^=</p>
    </div>

    <script>
        function showPhoto() {
            document.getElementById('welcome-page').style.display = 'none';
            document.getElementById('photo-page').style.display = 'block';
        }

        function createPaw() {
            const container = document.getElementById('paw-container');
            const paw = document.createElement('div');
            paw.classList.add('falling-paw');
            
            const icons = ['🐾', '🦴', '🐈', '✨', '☁️'];
            paw.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            paw.style.left = Math.random() * 100 + 'vw';
            paw.style.animationDuration = (Math.random() * 3 + 3) + 's'; 
            paw.style.fontSize = (Math.random() * 20 + 20) + 'px';

            container.appendChild(paw);

            setTimeout(() => { paw.remove(); }, 6000);
        }

        setInterval(createPaw, 400);
    </script>
</body>
</html>
